[package]
name = "adumbra-enclave"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
sha3 = "0.10"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"

[profile.release]
lto = true